spring.application.name=demo

# Conexão com o banco de dados local SQLite
spring.datasource.url=jdbc:sqlite:dados.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialeto correto para o Hibernate moderno reconhecer o SQLite
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Cria ou atualiza as tabelas automaticamente com base nas classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Imprime os comandos SQL no console para aprendizado e depuração
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
